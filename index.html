        <h1>Don’t take one AI’s word for it.</h1>
        <p>Dissentry is Community Notes for AI answers, built by <a href="https://lihaila.com/en/">Lihai La LLC</a>. Ask any AI model (Claude, GPT, Gemini, DeepSeek, Qwen, Grok, OpenRouter, or local Ollama/LM Studio models) and let your other models fact-check the answer and attach a dissent note only when they find a mistake.</p>
        <p>Free &amp; open source (MIT). Your keys and conversations stay in your browser. Enable JavaScript to launch Dissentry, or run <code>npx dissentry</code> locally.</p>
