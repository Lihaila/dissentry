# Publishes to npm and the Official MCP Registry when a version tag (v1.2.3) is pushed.
# Uses OIDC trusted publishing for both npm and registry.modelcontextprotocol.io (no long-lived secrets).
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

env:
  MCP_PUBLISHER_VERSION: v1.8.12

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest && npm --version
      - name: Tag must match package.json and server.json versions
        run: |
          node -e '
            const pkg = require("./package.json");
            const srv = require("./server.json");
            if ("v" + pkg.version !== process.env.GITHUB_REF_NAME) {
              console.error(`Tag ${process.env.GITHUB_REF_NAME} != package.json ${pkg.version}`);
              process.exit(1);
            }
            if (srv.version !== pkg.version || srv.packages?.[0]?.version !== pkg.version) {
              console.error(`server.json versions do not match package.json ${pkg.version}`);
              process.exit(1);
            }
            if (pkg.mcpName !== srv.name) {
              console.error(`package.json mcpName (${pkg.mcpName}) != server.json name (${srv.name})`);
              process.exit(1);
            }
          '
      - run: npm ci
      - run: npm test
      - run: npm publish --access public

  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive"

      - name: Publish to Official MCP Registry (domain-verified com.lihaila/dissentry)
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ./mcp-publisher login http --domain lihaila.com --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          for attempt in $(seq 1 15); do
            echo "Publishing to Official MCP Registry (attempt $attempt/15)..."
            if ./mcp-publisher publish; then
              exit 0
            fi
            if [ "$attempt" -lt 15 ]; then
              echo "Waiting 20s for npm CDN propagation before retry..."
              sleep 20
            fi
          done
          exit 1
